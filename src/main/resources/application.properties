spring.application.name=cinema

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinema}
spring.datasource.username=${DATASOURCE_USERNAME:cinema}
spring.datasource.password=${DATASOURCE_PASSWORD:cinema}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
