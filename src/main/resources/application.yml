spring:
  application:
    name: cinema

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinema}
    username: ${DATASOURCE_USERNAME:cinema}
    password: ${DATASOURCE_PASSWORD:cinema}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
